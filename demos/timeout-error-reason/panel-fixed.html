<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; padding: 1rem; font-size: 0.85rem; }
  button { padding: 0.35rem 0.7rem; border: none; border-radius: 4px; background: #2563eb; color: white; font-weight: 600; cursor: pointer; margin-right: 0.3rem; }
  .av { font-family: monospace; font-size: 0.75rem; margin-top: 0.6rem; padding: 0.4rem; background: #1e293b; border-radius: 6px; white-space: pre-wrap; }
</style>
<script>
(function() {
  window.fetch = function(url, opts) {
    return new Promise(function(_, reject) {
      if (opts && opts.signal) {
        opts.signal.addEventListener('abort', function() {
          reject(opts.signal.reason || new DOMException('The operation was aborted', 'AbortError'));
        });
      }
    });
  };
  document.addEventListener('htmx:error', function(e) {
    var reason = e.detail.ctx && e.detail.ctx.request && e.detail.ctx.request.signal && e.detail.ctx.request.signal.reason;
    var name = (reason && reason.name) || (e.detail.error && e.detail.error.name) || '?';
    var msg = 'signal.reason = ' + name;
    document.getElementById('av').textContent = msg;
    var expectTimeout = document.getElementById('av').dataset.expect === 'timeout';
    var ok = expectTimeout ? name === 'TimeoutError' : name !== 'TimeoutError';
    parent.postMessage({ type: 'result', label: 'fixed', ok: ok, msg: msg }, '*');
  });
})();
</script>
<script src="builds/htmx-after.js"></script>
</head>
<body>
<button id="t" hx-get="/slow" hx-swap="none" hx-config="timeout:120ms">Timeout</button>
<button id="r" hx-get="/slow" hx-swap="none" hx-sync="this:replace">Replace (click twice)</button>
<div class="av" id="av">—</div>
<script>
document.getElementById('t').addEventListener('click', function() {
  document.getElementById('av').dataset.expect = 'timeout';
});
document.getElementById('r').addEventListener('click', function() {
  document.getElementById('av').dataset.expect = 'replace';
});
</script>
</body></html>
